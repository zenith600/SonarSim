[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sonarsim"
dynamic = ["version"]
description = "Physics-based generation of labelled active sonar datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "SonarSim authors" }]
keywords = ["sonar", "underwater acoustics", "simulation", "synthetic data",
            "target scattering", "beamforming", "dataset generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
mesh = ["trimesh>=4.0"]          # STL / GLTF / PLY meshes (OBJ needs nothing extra)
plot = ["matplotlib>=3.7"]       # examples/paper_figures.py
dev = ["pytest>=8", "build>=1.2", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
sonarsim-generate = "sonarsim.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sonarsim._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
